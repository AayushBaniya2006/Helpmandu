name: helpmandu
description: Cross-platform home services marketplace for Kathmandu.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.5
  firebase_storage: ^12.3.0
  firebase_app_check: ^0.3.1+3

  # Authentication
  google_sign_in: ^6.2.1

  # Communication
  flutter_phone_direct_caller: ^2.1.1
  url_launcher: ^6.1.12

  # Deep Links
  app_links: ^6.3.0

  # Notifications
  flutter_local_notifications: ^16.1.0

  # UI Components
  cupertino_icons: ^1.0.2
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # State Management
  provider: ^6.0.5

  # Localization (intl provided by flutter_localizations)

  # Storage
  shared_preferences: ^2.2.0

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # Utilities
  timeago: ^3.5.0
  uuid: ^4.1.0

  # Dev utilities (keeping for icons)
  flutter_launcher_icons: ^0.13.1
  change_app_package_name: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  flutter_lints: ^2.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "lib/images/Icon.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - lib/images/
    - .env

  # Localization
  # fonts:
  #   - family: NotoSansDevanagari
  #     fonts:
  #       - asset: fonts/NotoSansDevanagari-Regular.ttf
